name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Движки (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/fetch-engines.ps1 -Rid ${{ matrix.rid }}
      - name: Движки (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/fetch-engines.sh ${{ matrix.rid }}

      - name: Тесты
        run: dotnet test tests/ByeDpiPc.Core.Tests -c Release

      - name: Сборка
        run: >
          dotnet publish src/ByeDpiPc.App -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o out/ByeDPI-PC-${{ matrix.rid }}

      - name: Архив
        shell: bash
        run: |
          cp LICENSE README.md out/ByeDPI-PC-${{ matrix.rid }}/
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../ByeDPI-PC-${{ matrix.rid }}.zip ByeDPI-PC-${{ matrix.rid }}; else tar -czf ../ByeDPI-PC-${{ matrix.rid }}.tar.gz ByeDPI-PC-${{ matrix.rid }}; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ByeDPI-PC-${{ matrix.rid }}
          path: ByeDPI-PC-${{ matrix.rid }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
